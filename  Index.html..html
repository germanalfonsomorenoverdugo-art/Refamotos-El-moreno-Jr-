<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Moreno Jr | Ventas e Inventario</title>
<style>
:root{--bg:#0b0f0e;--panel:#141a18;--panel2:#1b2320;--line:#2b3631;--txt:#f1f5f2;--muted:#9eaaa3;--green:#27d45a;--green2:#138a39;--red:#ff5b5b;--yellow:#f5c451}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#071109;font-weight:750}button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}button.danger{background:#482020;color:#ffb7b7}button:disabled{opacity:.4;cursor:not-allowed}.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:#101513;border-right:1px solid var(--line);padding:22px 14px;flex-shrink:0}.brand{padding:10px 12px 24px}.brandmark{width:42px;height:42px;border:2px solid var(--green);border-radius:13px;display:grid;place-items:center;color:var(--green);font-weight:900;font-size:20px;margin-bottom:10px}.brand strong{display:block;font-size:16px;line-height:1.25}.brand small{color:var(--muted)}.nav{display:grid;gap:6px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:600}.nav button.active,.nav button:hover{background:#1b2920;color:var(--green)}.nav span{display:inline-block;width:28px}.sidefoot{position:sticky;top:calc(100vh - 75px);margin:32px 10px 0;color:var(--muted);font-size:12px}.main{min-width:0;flex:1}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0e1311;position:sticky;top:0;z-index:2}.top b{font-size:15px}.top small{color:var(--muted)}.content{padding:28px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.pagehead h1{font-size:25px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:25px;margin:8px 0 4px}.stat small{color:var(--muted)}.green{color:var(--green)!important}.red{color:var(--red)!important}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.boxtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.boxtitle h2{font-size:16px;margin:0}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.field{background:#0d1210;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;outline:none}.field:focus{border-color:var(--green)}.toolbar .field{flex:1;min-width:170px}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--muted);font-size:12px;font-weight:650;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #222b27;font-size:13px}tr:last-child td{border-bottom:0}.pill{font-size:11px;padding:4px 8px;border-radius:30px;background:#1b3022;color:var(--green)}.pill.low{background:#392d16;color:var(--yellow)}.empty{text-align:center;color:var(--muted);padding:35px 10px}.pos{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}.product{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:7px}.product b{font-size:14px}.product small{color:var(--muted)}.product .price{font-size:18px;font-weight:800;color:var(--green)}.product button{width:100%;padding:9px}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cartrow small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:4px 9px;border-radius:7px}.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-weight:700}.total strong{font-size:25px}.full{width:100%}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{font-size:12px;color:var(--muted);display:grid;gap:6px}.formgrid .field{width:100%}.note{background:#17251b;border:1px solid #2d5138;color:#b8d7c0;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;margin-top:15px}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.mobilebar{display:none}
@media(max-width:900px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.pos{grid-template-columns:1fr}}
@media(max-width:600px){.layout{display:block;padding-bottom:70px}.sidebar{display:none}.top{height:58px;padding:0 15px}.content{padding:17px 13px}.pagehead{align-items:flex-start}.pagehead h1{font-size:21px}.cards{gap:9px}.stat{padding:13px}.stat strong{font-size:20px}.stat label{font-size:11px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product{padding:10px}.box{padding:13px;overflow-x:auto}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#101513;border-top:1px solid var(--line);z-index:5;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.mobilebar button{background:transparent;color:var(--muted);padding:6px 1px;font-size:10px;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:var(--green)}.mobilebar i{font-style:normal;font-size:18px}.formgrid{grid-template-columns:1fr}.pagehead .actions button{font-size:12px;padding:9px}.top small{font-size:11px}}
</style></head>
<body><div class="layout">
<aside class="sidebar"><div class="brand"><div class="brandmark">M</div><strong>MOTO ACCESORIOS<br>EL MORENO JR</strong><small>Ventas e inventario</small></div><div class="nav" id="nav">
<button data-page="dashboard" class="active"><span>▦</span> Resumen</button><button data-page="pos"><span>🛒</span> Punto de venta</button><button data-page="inventory"><span>▤</span> Inventario</button><button data-page="purchases"><span>＋</span> Entradas / compras</button><button data-page="sales"><span>▧</span> Historial de ventas</button><button data-page="reports"><span>◷</span> Ganancias y reportes</button><button data-page="cash"><span>▣</span> Corte de caja</button></div><div class="sidefoot">Sistema de administración<br>El Moreno Jr</div></aside>
<main class="main"><header class="top"><b id="topname">Resumen general</b><small id="today"></small></header><div class="content" id="app"></div></main>
</div><div class="mobilebar" id="mobilebar"><button data-page="dashboard" class="active"><i>▦</i>Inicio</button><button data-page="pos"><i>🛒</i>Venta</button><button data-page="inventory"><i>▤</i>Inventario</button><button data-page="sales"><i>▧</i>Ventas</button><button data-page="reports"><i>◷</i>Reportes</button></div>
<script>
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}), today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem('morenoDB')||'null')||{products:[],sales:[],purchases:[],expenses:[]},cart=[],page='dashboard';
function save(){localStorage.setItem('morenoDB',JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topname').textContent=({dashboard:'Resumen general',pos:'Punto de venta',inventory:'Inventario',purchases:'Entradas y compras',sales:'Historial de ventas',reports:'Ganancias y reportes',cash:'Corte de caja'})[p];render()}
function metric(label,value,sub='',cls=''){return `<div class="stat"><label>${label}</label><strong class="${cls}">${value}</strong><small>${sub}</small></div>`}
function header(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function sumSales(list){return list.reduce((a,s)=>a+s.total,0)}function sumProfit(list){return list.reduce((a,s)=>a+s.profit,0)}
function render(){let el=$('#app'); if(page==='dashboard')el.innerHTML=dashboard();if(page==='inventory')el.innerHTML=inventory();if(page==='pos')el.innerHTML=pos();if(page==='purchases')el.innerHTML=purchases();if(page==='sales')el.innerHTML=sales();if(page==='reports')el.innerHTML=reports();if(page==='cash')el.innerHTML=cash();bind()}
function dashboard(){let sold=db.sales.filter(s=>s.date===today()),allUnits=db.products.reduce((a,p)=>a+p.stock,0),cost=db.products.reduce((a,p)=>a+p.stock*p.cost,0),retail=db.products.reduce((a,p)=>a+p.stock*p.price,0),potential=retail-cost;let recent=[...db.sales].reverse().slice(0,5);return `${header('Resumen general','Vista rápida de tu negocio',`<button onclick="setPage('pos')">＋ Nueva venta</button>`)}<div class="cards">${metric('Ventas de hoy',money(sumSales(sold)),sold.length+' operaciones')}${metric('Ganancia de hoy',money(sumProfit(sold)),'Utilidad bruta','green')}${metric('Productos en inventario',allUnits+' piezas',db.products.length+' productos')}${metric('Ganancia potencial',money(potential),'Si vendes todo lo disponible','green')}</div><div class="grid2"><section class="box"><div class="boxtitle"><h2>Ventas recientes</h2><button class="secondary" onclick="setPage('sales')">Ver historial</button></div>${recent.length?tableSales(recent):'<div class="empty">Aún no hay ventas registradas.</div>'}</section><section class="box"><div class="boxtitle"><h2>Resumen de inventario</h2><button class="secondary" onclick="setPage('inventory')">Ver productos</button></div><div class="total"><span class="muted">Valor al costo</span><b>${money(cost)}</b></div><div class="total"><span class="muted">Valor a precio público</span><b>${money(retail)}</b></div><div class="total"><span class="muted">Utilidad potencial</span><b class="green">${money(potential)}</b></div><div class="note">La utilidad mostrada es estimada y no descuenta gastos operativos, impuestos ni comisiones.</div></section></div>`}
function tableSales(list){return `<table><thead><tr><th>Folio</th><th>Fecha</th><th>Total</th><th>Ganancia</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.id)}</td><td>${s.date}</td><td>${money(s.total)}</td><td class="green">${money(s.profit)}</td></tr>`).join('')}</tbody></table>`}
function inventory(){let q=(window.invq||'').toLowerCase(),list=db.products.filter(p=>(p.name+' '+p.code+' '+p.category).toLowerCase().includes(q)),cost=db.products.reduce((a,p)=>a+p.stock*p.cost,0),retail=db.products.reduce((a,p)=>a+p.stock*p.price,0);return `${header('Inventario','Administra productos, existencias, costos y precios',`<button onclick="productForm()">＋ Agregar producto</button>`)}<div class="cards">${metric('Productos',db.products.length,'Tipos registrados')}${metric('Unidades',db.products.reduce((a,p)=>a+p.stock,0),'Piezas disponibles')}${metric('Valor al costo',money(cost),'Capital en mercancía')}${metric('Ganancia potencial',money(retail-cost),'Inventario restante','green')}</div><div class="box"><div class="toolbar"><input class="field" id="invsearch" placeholder="Buscar por producto, código o categoría..." value="${esc(window.invq||'')}"></div><table><thead><tr><th>Producto</th><th>Código</th><th>Exist.</th><th>Costo</th><th>Precio</th><th>Ganancia/u.</th><th>Acciones</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.category||'General')}</small></td><td>${esc(p.code||'—')}</td><td><span class="pill ${p.stock<=p.min?'low':''}">${p.stock}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="green">${money(p.price-p.cost)}</td><td><div class="actions"><button class="secondary" onclick="productForm('${p.id}')">Editar</button><button class="danger" onclick="delProduct('${p.id}')">×</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay productos. Agrega el primero.</td></tr>'}</tbody></table></div>`}
function productForm(id){let p=db.products.find(x=>x.id===id)||{name:'',code:'',category:'',stock:0,cost:0,price:0,min:2};let name=prompt('Nombre del producto:',p.name);if(name===null)return;if(!name.trim())return alert('Escribe el nombre.');let code=prompt('Código / SKU:',p.code||'');if(code===null)return;let category=prompt('Categoría:',p.category||'Refacciones');if(category===null)return;let cost=Number(prompt('Costo de compra por unidad (MXN):',p.cost));if(!Number.isFinite(cost)||cost<0)return alert('Costo inválido.');let price=Number(prompt('Precio de venta público (MXN):',p.price));if(!Number.isFinite(price)||price<0)return alert('Precio inválido.');let stock=p.stock;if(!id){stock=Number(prompt('Existencia inicial (piezas):','0'));if(!Number.isInteger(stock)||stock<0)return alert('Existencia inválida.')}let min=Number(prompt('Avisar cuando queden esta cantidad o menos:',p.min??2));if(!Number.isInteger(min)||min<0)min=2;let row={...p,id:p.id||crypto.randomUUID(),name:name.trim(),code:code.trim(),category:category.trim(),cost,price,stock,min};if(id)db.products=db.products.map(x=>x.id===id?row:x);else db.products.push(row);save();render()}
function delProduct(id){if(confirm('¿Eliminar este producto del catálogo?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
function pos(){let q=(window.posq||'').toLowerCase(),list=db.products.filter(p=>(p.name+' '+p.code+' '+p.category).toLowerCase().includes(q));let total=cart.reduce((a,c)=>a+c.qty*c.price,0),profit=cart.reduce((a,c)=>a+c.qty*(c.price-c.cost),0);return `${header('Punto de venta','Agrega productos al carrito y registra el cobro')}<div class="pos"><section class="box"><div class="toolbar"><input class="field" id="possearch" placeholder="Buscar producto o escanear código..." value="${esc(window.posq||'')}"></div><div class="products">${list.map(p=>`<div class="product"><b>${esc(p.name)}</b><small>${esc(p.code||p.category||'')}</small><div class="price">${money(p.price)}</div><small>${p.stock} disponibles</small><button ${p.stock<1?'disabled':''} onclick="addCart('${p.id}')">＋ Agregar</button></div>`).join('')||'<div class="empty">No hay productos que coincidan.</div>'}</div></section><section class="box"><div class="boxtitle"><h2>Carrito de venta</h2><button class="secondary" onclick="cart=[];render()">Vaciar</button></div>${cart.map(c=>`<div class="cartrow"><div><b>${esc(c.name)}</b><small>${money(c.price)} c/u</small><div class="qty"><button class="secondary" onclick="qtyCart('${c.id}',-1)">−</button><span>${c.qty}</span><button class="secondary" onclick="qtyCart('${c.id}',1)">＋</button></div></div><b>${money(c.qty*c.price)}</b></div>`).join('')||'<div class="empty">El carrito está vacío.</div>'}<div class="total"><span>Subtotal</span><b>${money(total)}</b></div><label class="muted">Descuento (MXN)<br><input class="field" style="width:100%;margin-top:6px" id="discount" type="number" min="0" max="${total}" value="0"></label><label class="muted" style="display:block;margin-top:12px">Método de pago<br><select class="field" id="pay" style="width:100%;margin-top:6px"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mixto</option></select></label><div class="total"><span>Total</span><strong id="postotal">${money(total)}</strong></div><div class="total"><span class="muted">Ganancia estimada</span><b class="green" id="posprofit">${money(profit)}</b></div><button class="full" ${!cart.length?'disabled':''} onclick="checkout()">Registrar venta</button><div class="note">La ganancia es antes de gastos, impuestos y comisiones. El costo unitario se conserva en cada venta.</div></section></div>`}
function addCart(id){let p=db.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(!p||p.stock<1)return;if(c){if(c.qty>=p.stock)return alert('No hay más existencia disponible.');c.qty++}else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});render()}
function qtyCart(id,d){let c=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);else if(c.qty>p.stock){c.qty=p.stock;alert('Cantidad máxima según inventario.')}render()}
function checkout(){let sub=cart.reduce((a,c)=>a+c.qty*c.price,0),discount=Number($('#discount').value||0);if(discount<0||discount>sub)return alert('Revisa el descuento.');if(!cart.length)return;for(let c of cart){let p=db.products.find(x=>x.id===c.id);if(!p||p.stock<c.qty)return alert('Existencia insuficiente para '+c.name)}let total=sub-discount,base=cart.reduce((a,c)=>a+c.qty*c.cost,0),profit=total-base;let s={id:'V-'+Date.now().toString().slice(-8),date:today(),created:new Date().toISOString(),items:cart.map(c=>({...c})),subtotal:sub,discount,total,cost:base,profit,payment:$('#pay').value};db.sales.push(s);cart.forEach(c=>{db.products.find(p=>p.id===c.id).stock-=c.qty});save();cart=[];window.posq='';alert('Venta registrada. Folio: '+s.id+'\\nTotal: '+money(total)+'\\nGanancia: '+money(profit));setPage('sales')}
function purchases(){return `${header('Entradas y compras','Registra mercancía recibida de proveedores')}<div class="grid2"><section class="box"><div class="boxtitle"><h2>Nueva entrada de mercancía</h2></div><div class="formgrid"><label>Producto<select class="field" id="buyprod">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (stock: ${p.stock})</option>`).join('')}</select></label><label>Cantidad<input class="field" id="buyqty" type="number" min="1" value="1"></label><label>Costo unitario<input class="field" id="buycost" type="number" min="0" step=".01" placeholder="0.00"></label><label>Proveedor<input class="field" id="supplier" placeholder="Nombre del proveedor"></label></div><button style="margin-top:16px" onclick="addPurchase()">Registrar entrada</button><div class="note">La entrada aumenta existencias y actualiza el costo actual del producto. Las ventas anteriores mantienen el costo histórico.</div></section><section class="box"><h2 style="font-size:16px">Últimas compras</h2>${db.purchases.length?`<table><thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Total</th></tr></thead><tbody>${db.purchases.slice().reverse().slice(0,12).map(x=>`<tr><td>${x.date}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sin entradas registradas.</div>'}</section></div>`}
function addPurchase(){let p=db.products.find(x=>x.id===$('#buyprod').value),qty=Number($('#buyqty').value),cost=Number($('#buycost').value);if(!p)return alert('Primero agrega productos al inventario.');if(!Number.isInteger(qty)||qty<1||!Number.isFinite(cost)||cost<0)return alert('Revisa cantidad y costo.');p.stock+=qty;p.cost=cost;db.purchases.push({date:today(),id:p.id,name:p.name,qty,cost,total:qty*cost,supplier:$('#supplier').value});save();render();alert('Entrada registrada.')}
function sales(){let list=db.sales.slice().reverse();return `${header('Historial de ventas','Consulta operaciones registradas')}<div class="cards">${metric('Ventas acumuladas',money(sumSales(db.sales)),db.sales.length+' operaciones')}${metric('Ganancia acumulada',money(sumProfit(db.sales)),'Utilidad bruta','green')}</div><div class="box">${list.length?`<table><thead><tr><th>Folio / fecha</th><th>Productos</th><th>Pago</th><th>Total</th><th>Ganancia</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${s.id}</b><br><small class="muted">${s.date}</small></td><td>${s.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td class="green">${money(s.profit)}</td><td><button class="secondary" onclick="saleDetail('${s.id}')">Ver</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Todavía no hay ventas.</div>'}</div>`}
function saleDetail(id){let s=db.sales.find(x=>x.id===id);alert(`Folio: ${s.id}\\nFecha: ${s.date}\\n\\n${s.items.map(i=>i.name+' × '+i.qty+' = '+money(i.qty*i.price)).join('\\n')}\\n\\nSubtotal: ${money(s.subtotal)}\\nDescuento: ${money(s.discount)}\\nCosto: ${money(s.cost)}\\nTotal: ${money(s.total)}\\nGanancia: ${money(s.profit)}\\nPago: ${s.payment}`)}
function reports(){let month=today().slice(0,7),m=db.sales.filter(s=>s.date.startsWith(month)),cost=db.products.reduce((a,p)=>a+p.stock*p.cost,0),retail=db.products.reduce((a,p)=>a+p.stock*p.price,0),by={};db.sales.forEach(s=>s.items.forEach(i=>{by[i.name]??={qty:0,revenue:0,profit:0};by[i.name].qty+=i.qty;by[i.name].revenue+=i.qty*i.price;by[i.name].profit+=i.qty*(i.price-i.cost)}));let rank=Object.entries(by).sort((a,b)=>b[1].qty-a[1].qty);return `${header('Ganancias y reportes','Utilidad por periodo y rendimiento de productos')}<div class="cards">${metric('Ventas del mes',money(sumSales(m)),m.length+' operaciones')}${metric('Ganancia del mes',money(sumProfit(m)),'Antes de gastos','green')}${metric('Ganancia histórica',money(sumProfit(db.sales)),'Todas las ventas','green')}${metric('Ganancia potencial inventario',money(retail-cost),'Existencias actuales','green')}</div><div class="box"><div class="boxtitle"><h2>Ganancias por producto vendido</h2></div>${rank.length?`<table><thead><tr><th>Producto</th><th>Unidades</th><th>Ingresos</th><th>Ganancia</th></tr></thead><tbody>${rank.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.qty}</td><td>${money(v.revenue)}</td><td class="green">${money(v.profit)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Las ganancias por producto aparecerán al registrar ventas.</div>'}<div class="note">Las cifras de ganancia son utilidad bruta: ventas menos costo de mercancía. Para utilidad neta, registra también renta, envíos, comisiones y otros gastos por separado.</div></div>`}
function cash(){let list=db.sales.filter(s=>s.date===today()),cash=list.filter(s=>s.payment==='Efectivo');return `${header('Corte de caja','Resumen de operaciones de hoy',`<button class="secondary" onclick="window.print()">Imprimir corte</button>`)}<div class="cards">${metric('Ventas del día',money(sumSales(list)),list.length+' operaciones')}${metric('Efectivo registrado',money(sumSales(cash)),'Pagos en efectivo')}${metric('Transferencias',money(sumSales(list.filter(s=>s.payment==='Transferencia'))),'Pagos electrónicos')}${metric('Ganancia del día',money(sumProfit(list)),'Utilidad bruta','green')}</div><div class="box"><h2 style="font-size:16px">Detalle del corte · ${today()}</h2>${list.length?tableSales(list):'<div class="empty">No hay ventas registradas hoy.</div>'}<div class="note">Este corte resume ventas por método de pago. No representa necesariamente el efectivo físico en caja si hubo retiros, gastos o pagos mixtos.</div></div>`}
function bind(){let i=$('#invsearch');if(i)i.oninput=e=>{window.invq=e.target.value;let pos=e.target.selectionStart;render();$('#invsearch').focus();$('#invsearch').setSelectionRange(pos,pos)};let s=$('#possearch');if(s)s.oninput=e=>{window.posq=e.target.value;let pos=e.target.selectionStart;render();$('#possearch').focus();$('#possearch').setSelectionRange(pos,pos)};let d=$('#discount');if(d)d.oninput=()=>{let sub=cart.reduce((a,c)=>a+c.qty*c.price,0),v=Math.min(Math.max(0,Number(d.value||0)),sub),cost=cart.reduce((a,c)=>a+c.qty*c.cost,0);$('#postotal').textContent=money(sub-v);$('#posprofit').textContent=money(sub-v-cost)}}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#today').textContent=new Date().toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short',year:'numeric'});render();
</script></body></html>
