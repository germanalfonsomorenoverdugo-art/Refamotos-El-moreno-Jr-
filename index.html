<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Moreno Jr | Tienda y administración</title>
<style>
:root{--bg:#0b0f0e;--panel:#141a18;--panel2:#1b2320;--line:#2b3631;--txt:#f1f5f2;--muted:#9eaaa3;--green:#27d45a;--red:#ff5b5b;--yellow:#f5c451}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#071109;font-weight:750}button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}button.danger{background:#482020;color:#ffb7b7}button:disabled{opacity:.45;cursor:not-allowed}.top{position:sticky;top:0;z-index:5;background:#0e1311;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:13px max(16px,calc((100vw - 1180px)/2));gap:12px}.brand{display:flex;align-items:center;gap:11px;font-weight:850}.mark{width:40px;height:40px;border:2px solid var(--green);border-radius:12px;display:grid;place-items:center;color:var(--green);font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.top-actions{display:flex;gap:8px;align-items:center}.wrap{max-width:1180px;margin:auto;padding:25px 17px 60px}.hero{padding:26px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#142019,#101513);margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:clamp(23px,4vw,34px)}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.field{width:100%;min-width:0;background:#0d1210;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field:focus{border-color:var(--green)}.search{flex:1;min-width:180px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:15px 0}.stat,.box{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin:7px 0}.green{color:var(--green)}.muted{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.product{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.product img{width:100%;height:150px;object-fit:cover;background:#101513}.product .pbody{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.product b{font-size:14px}.price{font-size:19px;color:var(--green);font-weight:850}.product small{color:var(--muted)}.product button{width:100%;margin-top:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.pagehead h1{font-size:24px;margin:0 0 4px}.pagehead p{color:var(--muted);margin:0}.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0 12px;margin-bottom:8px}.tabs button{white-space:nowrap;background:transparent;color:var(--muted)}.tabs button.active{background:#1b2920;color:var(--green)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.formgrid label{display:grid;gap:6px;color:var(--muted);font-size:12px}.formgrid .wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:540px}th{font-size:12px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}td{font-size:13px;padding:11px 10px;border-bottom:1px solid #222b27}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:35px 12px;text-align:center;color:var(--muted)}.note{margin-top:13px;background:#17251b;border:1px solid #2d5138;color:#b8d7c0;border-radius:11px;padding:11px;font-size:12px;line-height:1.5}.cartline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.cartline small{display:block;color:var(--muted)}.qty{display:flex;align-items:center;gap:8px;margin-top:5px}.qty button{padding:3px 9px}.total{display:flex;justify-content:space-between;align-items:center;margin:13px 0;font-weight:750}.total strong{font-size:24px}.hidden{display:none!important}.status{font-size:11px;border-radius:20px;padding:4px 8px;background:#1b3022;color:var(--green)}.dangertext{color:#ff9292}.auth{max-width:450px;margin:40px auto}.auth h2{margin-top:0}.msg{font-size:13px;color:var(--yellow);margin-top:9px;white-space:pre-wrap}.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}@media(max-width:700px){.top{padding:10px 12px}.top .brand{font-size:13px}.top .mark{width:35px;height:35px}.top-actions button{padding:9px;font-size:12px}.wrap{padding:16px 12px 45px}.hero{padding:20px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product img{height:112px}.product .pbody{padding:10px}.product b{font-size:12px}.price{font-size:17px}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start}.pagehead h1{font-size:21px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">M</div><div>MOTO ACCESORIOS Y REFACCIONES<small>EL MORENO JR</small></div></div><div class="top-actions"><button class="secondary" id="storeBtn">Tienda</button><button id="adminBtn">Administrar</button></div></header>
<main class="wrap" id="app"><div class="empty">Cargando tienda…</div></main><footer class="foot">Moto Accesorios y Refacciones El Moreno Jr</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jdhqeukwrsqimlfsorll.supabase.co';
const SUPABASE_KEY='sb_publishable_6euoeLTO6BRoqJc3rM-OEw_S2U8OcZ1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}), today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let products=[],inventory=[],sales=[],purchases=[],expenses=[],orders=[],cart=[],mode='store',adminPage='home',editingId=null,user=null,pendingWhatsAppUrl='';
const ADMIN_UID='a0604d37-ac8c-452c-a29e-ef0ee3fdfeb7';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stockFor(id){return inventory.find(x=>x.product_id===id)||{stock:0,cost:0}}
function say(e){return e?.message||String(e||'Ocurrió un error')}
async function loadStore(){const {data,error}=await sb.from('products').select('id,name,code,category,description,price,image_url,active').eq('active',true).order('name');if(error)throw error;products=data||[]}
async function loadAdmin(){if(!user||user.id!==ADMIN_UID)throw Error('Esta cuenta no tiene permisos de administrador.');const [p,i,s,b,x,o]=await Promise.all([sb.from('products').select('*').order('name'),sb.from('inventory').select('*'),sb.from('sales').select('*').order('created_at',{ascending:false}).limit(500),sb.from('purchases').select('*').order('created_at',{ascending:false}).limit(300),sb.from('expenses').select('*').order('created_at',{ascending:false}).limit(300),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200)]);for(const r of [p,i,s,b,x,o])if(r.error)throw r.error;products=p.data||[];inventory=i.data||[];sales=s.data||[];purchases=b.data||[];expenses=x.data||[];orders=o.data||[]}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function storeView(){const active=products.filter(p=>p.active);return `<section class="hero"><h1>Equipa tu moto con El Moreno Jr</h1><p>Accesorios y refacciones para darle estilo y poder único a tu moto.</p></section><div class="toolbar"><input class="field search" id="search" placeholder="Buscar producto, categoría o código..."><button class="secondary" onclick="showCart()">🛒 Carrito (${cart.reduce((a,c)=>a+c.qty,0)})</button></div><div class="products" id="storeProducts">${active.map(p=>`<article class="product">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="pbody"><small>${esc(p.category||'Accesorios y refacciones')}</small><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div>${p.description?`<small>${esc(p.description)}</small>`:''}<button onclick="addOrderCart('${p.id}')">Agregar al carrito</button></div></article>`).join('')||'<div class="empty">Próximamente agregaremos productos a la tienda.</div>'}</div><div class="note">La disponibilidad y confirmación del pedido se revisan directamente con el negocio. No se muestran cantidades de inventario.</div>`}
function filterStore(){let q=$('#search')?.value.toLowerCase()||'';let filtered=products.filter(p=>p.active&&[p.name,p.code,p.category,p.description].join(' ').toLowerCase().includes(q));$('#storeProducts').innerHTML=filtered.map(p=>`<article class="product">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="pbody"><small>${esc(p.category||'Accesorios y refacciones')}</small><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div>${p.description?`<small>${esc(p.description)}</small>`:''}<button onclick="addOrderCart('${p.id}')">Agregar al carrito</button></div></article>`).join('')||'<div class="empty">No encontramos productos.</div>'}
function addOrderCart(id){let p=products.find(x=>x.id===id&&x.active);if(!p)return;let c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderStore()}
function renderStore(){mode='store';$('#app').innerHTML=storeView();$('#storeBtn').classList.add('hidden');$('#adminBtn').textContent=user?.id===ADMIN_UID?'Panel privado':'Administrar';$('#search').oninput=filterStore}
function showCart(){if(!cart.length){alert('Tu carrito está vacío.');return}let total=cart.reduce((a,c)=>a+c.qty*c.price,0);$('#app').innerHTML=`${pageHead('Tu pedido','Revisa los productos antes de enviarlo')}<div class="two"><section class="box">${cart.map(c=>`<div class="cartline"><div><b>${esc(c.name)}</b><small>${money(c.price)} c/u</small><div class="qty"><button class="secondary" onclick="cartQty('${c.id}',-1)">−</button>${c.qty}<button class="secondary" onclick="cartQty('${c.id}',1)">＋</button><button class="secondary" onclick="cartRemove('${c.id}')">Quitar</button></div></div><b>${money(c.qty*c.price)}</b></div>`).join('')}<div class="total"><span>Total estimado</span><strong>${money(total)}</strong></div><button class="secondary" onclick="renderStore()">Seguir comprando</button></section><section class="box"><h2>Datos de contacto</h2><form id="orderForm" class="formgrid"><label>Nombre<input class="field" id="custName" required maxlength="100"></label><label>Teléfono<input class="field" id="custPhone" required maxlength="30" inputmode="tel"></label><label class="wide">Dirección o indicaciones (opcional)<textarea class="field" id="custAddress" rows="3" maxlength="300"></textarea></label><div class="wide"><button class="full" type="submit">Enviar pedido</button><p class="muted">El pedido queda pendiente de confirmación. El envío no descuenta existencias automáticamente.</p><div id="orderMsg" class="msg"></div></div></form></section></div>`;$('#orderForm').onsubmit=submitOrder}
function cartQty(id,d){let c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<1)cart=cart.filter(x=>x.id!==id);showCart()}
function cartRemove(id){cart=cart.filter(x=>x.id!==id);cart.length?showCart():renderStore()}
function openWhatsAppOrder(){if(pendingWhatsAppUrl)window.location.href=pendingWhatsAppUrl}
async function submitOrder(e){e.preventDefault();let btn=$('#orderForm button[type=submit]');btn.disabled=true;$('#orderMsg').textContent='Enviando…';try{const total=cart.reduce((a,c)=>a+c.qty*c.price,0),customer=$('#custName').value.trim(),phone=$('#custPhone').value.trim(),address=$('#custAddress').value.trim();const lines=cart.map(c=>`• ${c.name} — ${c.qty} x ${money(c.price)} = ${money(c.qty*c.price)}`);const message=['Hola, El Moreno Jr. Quiero realizar este pedido:','',`Nombre: ${customer}`,`Teléfono: ${phone}`,...(address?[`Dirección/indicaciones: ${address}`]:[]),'','Productos:',...lines,'',`TOTAL ESTIMADO: ${money(total)}`,'','Por favor, confirmen existencia, entrega y forma de pago.'];pendingWhatsAppUrl='https://wa.me/526221728692?text='+encodeURIComponent(message.join('\n'));const {error}=await sb.from('orders').insert({customer_name:customer,phone,address,items:cart.map(c=>({name:c.name,product_id:c.id,qty:c.qty,price:c.price})),total,status:'Pendiente'});if(error)throw error;cart=[];$('#app').innerHTML=`<section class="box empty"><h2>¡Pedido preparado!</h2><p>Tu pedido quedó registrado como pendiente. Ahora envíalo por WhatsApp para que El Moreno Jr confirme disponibilidad, entrega y forma de pago.</p><button onclick="openWhatsAppOrder()">Enviar lista completa por WhatsApp</button><p><button class="secondary" onclick="renderStore()">Volver a la tienda</button></p></section>`}catch(err){$('#orderMsg').textContent='No se pudo registrar el pedido: '+say(err);btn.disabled=false}}
function loginView(){mode='login';$('#app').innerHTML=`<section class="box auth"><h2>Acceso de administrador</h2><p class="muted">Inicia sesión con el correo y contraseña que registraste en Supabase.</p><form id="loginForm" class="formgrid"><label class="wide">Correo<input class="field" id="email" type="email" required autocomplete="username"></label><label class="wide">Contraseña<input class="field" id="password" type="password" required autocomplete="current-password"></label><div class="wide"><button class="full" type="submit">Iniciar sesión</button><div id="loginMsg" class="msg"></div></div></form><p><button class="secondary" onclick="renderStore()">Volver a la tienda</button></p></section>`;$('#loginForm').onsubmit=login}
async function login(e){e.preventDefault();let b=$('#loginForm button');b.disabled=true;$('#loginMsg').textContent='Verificando…';try{const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;if(data.user?.id!==ADMIN_UID){await sb.auth.signOut();throw Error('El usuario inició sesión, pero no corresponde al administrador autorizado.')}user=data.user;await adminStart()}catch(err){$('#loginMsg').textContent=say(err);b.disabled=false}}
async function adminStart(){mode='admin';$('#adminBtn').textContent='Tienda';try{await loadAdmin();renderAdmin()}catch(err){$('#app').innerHTML=`<section class="box"><h2>No se pudo cargar el panel</h2><p class="msg">${esc(say(err))}</p><button onclick="logout()">Cerrar sesión</button></section>`}}
async function logout(){await sb.auth.signOut();user=null;inventory=[];sales=[];purchases=[];expenses=[];orders=[];renderStore()}
function navAdmin(){return `<div class="tabs">${[['home','Resumen'],['products','Productos e inventario'],['purchases','Compras'],['sales','Ventas'],['reports','Reportes'],['orders','Pedidos']].map(([id,n])=>`<button class="${adminPage===id?'active':''}" onclick="goAdmin('${id}')">${n}</button>`).join('')}</div>`}
function renderAdmin(){mode='admin';$('#adminBtn').textContent='Tienda';let body='';if(adminPage==='home')body=adminHome();if(adminPage==='products')body=adminProducts();if(adminPage==='purchases')body=adminPurchases();if(adminPage==='sales')body=adminSales();if(adminPage==='reports')body=adminReports();if(adminPage==='orders')body=adminOrders();$('#app').innerHTML=`${pageHead('Panel privado','Administración de El Moreno Jr',`<button class="secondary" onclick="logout()">Cerrar sesión</button>`)}${navAdmin()}${body}`;bindAdmin()}
function goAdmin(p){adminPage=p;renderAdmin()}
function adminHome(){let day=today(),todaySales=sales.filter(s=>s.date===day),stock=inventory.reduce((a,i)=>a+Number(i.stock),0),potential=products.reduce((a,p)=>a+Number(p.price||0)*Number(stockFor(p.id).stock||0),0)-inventory.reduce((a,i)=>a+Number(i.cost||0)*Number(i.stock||0),0);return `<div class="cards"><div class="stat"><label>Ventas de hoy</label><strong>${money(todaySales.reduce((a,s)=>a+Number(s.total),0))}</strong><small>${todaySales.length} operaciones</small></div><div class="stat"><label>Ganancia de hoy</label><strong class="green">${money(todaySales.reduce((a,s)=>a+Number(s.profit),0))}</strong><small>Utilidad bruta</small></div><div class="stat"><label>Existencias</label><strong>${stock} piezas</strong><small>${products.length} productos</small></div><div class="stat"><label>Ganancia potencial</label><strong class="green">${money(potential)}</strong><small>Inventario actual</small></div></div><div class="box"><h3>Acciones rápidas</h3><div class="actions"><button onclick="goAdmin('products')">＋ Agregar producto</button><button class="secondary" onclick="goAdmin('purchases')">Registrar compra</button><button class="secondary" onclick="goAdmin('sales')">Punto de venta</button></div><p class="note">Sesión de administrador. Los costos, existencias, ventas y reportes se consultan con permisos privados.</p></div>`}
function adminProducts(){let rows=products.map(p=>{let i=stockFor(p.id);return `<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.code||p.category||'')}</small></td><td>${money(p.price)}</td><td>${i.stock||0}</td><td>${money(i.cost)}</td><td><span class="status">${p.active?'Activo':'Oculto'}</span></td><td><div class="actions"><button class="secondary" onclick="editProduct('${p.id}')">Editar</button><button class="secondary" onclick="toggleProduct('${p.id}',${!p.active})">${p.active?'Ocultar':'Activar'}</button></div></td></tr>`}).join('');return `<div class="two"><section class="box"><h3 id="productFormTitle">${editingId?'Editar producto':'Agregar producto'}</h3><form id="productForm" class="formgrid"><input type="hidden" id="productId" value="${editingId||''}"><label class="wide">Nombre<input class="field" id="pName" required maxlength="120"></label><label>Código / SKU<input class="field" id="pCode" maxlength="80"></label><label>Categoría<input class="field" id="pCategory" maxlength="80"></label><label>Precio de venta (MXN)<input class="field" id="pPrice" type="number" min="0" step="0.01" required></label><label>Costo unitario (MXN)<input class="field" id="pCost" type="number" min="0" step="0.01" required></label><label>Existencias iniciales<input class="field" id="pStock" type="number" min="0" step="1" required></label><label class="wide">Foto del producto (desde tu celular)<input class="field" id="pImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="muted">Elige una foto de tu galería. Máximo 5 MB. Si no seleccionas una nueva, se conserva la foto actual.</small><span id="imagePreviewWrap"></span></label><label class="wide">O URL de imagen (opcional)<input class="field" id="pImage" type="url" placeholder="https://..."></label><label class="wide">Descripción<textarea class="field" id="pDesc" rows="2" maxlength="500"></textarea></label><div class="wide actions"><button type="submit">Guardar producto</button><button type="button" class="secondary" onclick="clearProductForm()">Limpiar</button></div><div class="wide msg" id="productMsg"></div></form></section><section class="box"><h3>Inventario privado</h3><p class="muted">Las existencias y los costos solo se muestran en este panel.</p><div class="cards"><div class="stat"><label>Productos activos</label><strong>${products.filter(p=>p.active).length}</strong></div><div class="stat"><label>Unidades en existencia</label><strong>${inventory.reduce((a,i)=>a+Number(i.stock||0),0)}</strong></div></div><p class="note">Para publicar un producto en la tienda, déjalo como Activo. Los cambios se sincronizan en Supabase.</p></section></div><section class="box" style="margin-top:14px"><h3>Productos registrados</h3><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Costo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Todavía no hay productos.</td></tr>'}</tbody></table></div></section>`}
function editProduct(id){let p=products.find(x=>x.id===id),i=stockFor(id);if(!p)return;editingId=id;renderAdmin();$('#pName').value=p.name||'';$('#pCode').value=p.code||'';$('#pCategory').value=p.category||'';$('#pPrice').value=p.price||0;$('#pCost').value=i.cost||0;$('#pStock').value=i.stock||0;$('#pImage').value=p.image_url||'';$('#pDesc').value=p.description||'';$('#productFormTitle').textContent='Editar producto';if(p.image_url)$('#imagePreviewWrap').innerHTML=`<img src="${esc(p.image_url)}" alt="Foto actual" style="display:block;max-width:180px;max-height:150px;object-fit:contain;margin-top:8px;border-radius:10px">`}
function previewProductImage(){const f=$('#pImageFile')?.files?.[0],w=$('#imagePreviewWrap');if(!w)return;if(!f){w.innerHTML='';return}if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)){w.innerHTML='<small class="dangertext">Formato no admitido. Usa JPG, PNG, WEBP o GIF.</small>';$('#pImageFile').value='';return}if(f.size>5*1024*1024){w.innerHTML='<small class="dangertext">La imagen supera 5 MB.</small>';$('#pImageFile').value='';return}const url=URL.createObjectURL(f);w.innerHTML=`<img src="${url}" alt="Vista previa" style="display:block;max-width:180px;max-height:150px;object-fit:contain;margin-top:8px;border-radius:10px">`}
function clearProductForm(){editingId=null;renderAdmin()}
async function saveProduct(e){e.preventDefault();let b=$('#productForm button[type=submit]');b.disabled=true;$('#productMsg').textContent='Guardando…';try{let id=$('#productId').value,file=$('#pImageFile')?.files?.[0],imageUrl=$('#pImage').value.trim();if(file){if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>5*1024*1024)throw Error('Selecciona JPG, PNG, WEBP o GIF de máximo 5 MB.');const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[file.type],path=`${crypto.randomUUID()}.${ext}`;$('#productMsg').textContent='Subiendo foto…';const up=await sb.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;imageUrl=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}let payload={name:$('#pName').value.trim(),code:$('#pCode').value.trim(),category:$('#pCategory').value.trim(),price:Number($('#pPrice').value),image_url:imageUrl,description:$('#pDesc').value.trim(),active:true};if(!payload.name||payload.price<0)throw Error('Revisa nombre y precio.');$('#productMsg').textContent='Guardando producto…';let res=id?await sb.from('products').update(payload).eq('id',id).select().single():await sb.from('products').insert(payload).select().single();if(res.error)throw res.error;let pid=res.data.id;let inv=await sb.from('inventory').upsert({product_id:pid,stock:Number($('#pStock').value),cost:Number($('#pCost').value),updated_at:new Date().toISOString()},{onConflict:'product_id'});if(inv.error)throw inv.error;editingId=null;await loadAdmin();adminPage='products';renderAdmin()}catch(err){$('#productMsg').textContent=say(err);b.disabled=false}}
async function toggleProduct(id,active){let {error}=await sb.from('products').update({active}).eq('id',id);if(error)alert(say(error));else{await loadAdmin();renderAdmin()}}
function adminPurchases(){return `<div class="two"><section class="box"><h3>Registrar entrada de mercancía</h3><form id="purchaseForm" class="formgrid"><label class="wide">Producto<select class="field" id="buyProduct" required>${products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} · stock ${stockFor(p.id).stock||0}</option>`).join('')}</select></label><label>Cantidad<input class="field" id="buyQty" type="number" min="1" step="1" value="1" required></label><label>Costo unitario<input class="field" id="buyCost" type="number" min="0" step="0.01" required></label><label class="wide">Proveedor<input class="field" id="buySupplier" maxlength="120"></label><div class="wide"><button type="submit">Registrar compra</button><div id="buyMsg" class="msg"></div></div></form></section><section class="box"><h3>Compras recientes</h3>${purchases.slice(0,8).map(x=>`<p>${esc(x.product_name)} · ${x.qty} pzas<br><small class="muted">${esc(x.date)} · ${money(x.total)}</small></p>`).join('')||'<div class="empty">Sin compras registradas.</div>'}</section></div>`}
async function savePurchase(e){e.preventDefault();let b=$('#purchaseForm button');b.disabled=true;$('#buyMsg').textContent='Registrando…';try{let {error}=await sb.rpc('purchase_stock',{p_product_id:$('#buyProduct').value,p_qty:Number($('#buyQty').value),p_unit_cost:Number($('#buyCost').value),p_supplier:$('#buySupplier').value.trim()});if(error)throw error;await loadAdmin();renderAdmin()}catch(err){$('#buyMsg').textContent=say(err);b.disabled=false}}
function adminSales(){let list=sales;return `<section class="box"><h3>Punto de venta</h3><div class="toolbar"><input class="field search" id="saleSearch" placeholder="Buscar producto..."></div><div class="products" id="saleProducts">${products.filter(p=>p.active).map(p=>`<div class="product"><div class="pbody"><b>${esc(p.name)}</b><small>Existencia: ${stockFor(p.id).stock||0}</small><div class="price">${money(p.price)}</div><button onclick="addSaleCart('${p.id}')" ${Number(stockFor(p.id).stock)<1?'disabled':''}>Agregar</button></div></div>`).join('')||'<div class="empty">Agrega productos primero.</div>'}</div><h3 style="margin-top:20px">Carrito</h3><div id="saleCart">${saleCartHtml()}</div></section><section class="box" style="margin-top:14px"><h3>Historial de ventas</h3><div class="tablewrap"><table><thead><tr><th>Folio / fecha</th><th>Artículos</th><th>Pago</th><th>Total</th><th>Ganancia</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.folio)}<br><small class="muted">${esc(s.date)}</small></td><td>${(s.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td class="green">${money(s.profit)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Todavía no hay ventas.</td></tr>'}</tbody></table></div></section>`}
function saleCartHtml(){let sub=cart.reduce((a,c)=>a+c.qty*c.price,0);return `${cart.map(c=>`<div class="cartline"><div><b>${esc(c.name)}</b><small>${money(c.price)} c/u</small><div class="qty"><button class="secondary" onclick="saleQty('${c.id}',-1)">−</button>${c.qty}<button class="secondary" onclick="saleQty('${c.id}',1)">＋</button></div></div><b>${money(c.qty*c.price)}</b></div>`).join('')||'<p class="muted">Carrito vacío</p>'}<div class="formgrid" style="margin-top:12px"><label>Descuento MXN<input class="field" id="saleDiscount" type="number" min="0" max="${sub}" value="0"></label><label>Método de pago<select class="field" id="salePayment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mixto</option></select></label></div><div class="total"><span>Total</span><strong>${money(sub)}</strong></div><button onclick="checkoutSale()" ${!cart.length?'disabled':''}>Registrar venta</button> <button class="secondary" onclick="cart=[];renderAdmin()">Vaciar carrito</button>`}
function addSaleCart(id){let p=products.find(x=>x.id===id),stock=Number(stockFor(id).stock);if(!p||stock<1)return;let c=cart.find(x=>x.id===id);if(c){if(c.qty>=stock)return alert('Existencia insuficiente');c.qty++}else cart.push({id,name:p.name,price:Number(p.price),qty:1});$('#saleCart').innerHTML=saleCartHtml()}
function saleQty(id,d){let c=cart.find(x=>x.id===id),stock=Number(stockFor(id).stock);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);else if(c.qty>stock){c.qty=stock;alert('No hay más existencia')}$('#saleCart').innerHTML=saleCartHtml()}
async function checkoutSale(){if(!cart.length)return;let discount=Number($('#saleDiscount')?.value||0),payment=$('#salePayment')?.value||'Efectivo',sub=cart.reduce((a,c)=>a+c.qty*c.price,0);if(discount<0||discount>sub)return alert('Descuento inválido');try{let {data,error}=await sb.rpc('checkout_sale',{p_items:cart.map(c=>({product_id:c.id,qty:c.qty})),p_discount:discount,p_payment:payment});if(error)throw error;alert('Venta registrada. Folio: '+data);cart=[];await loadAdmin();renderAdmin()}catch(err){alert('No se pudo registrar la venta: '+say(err))}}
function adminReports(){let month=today().slice(0,7),ms=sales.filter(s=>String(s.date).startsWith(month)),total=sales.reduce((a,s)=>a+Number(s.total),0),profit=sales.reduce((a,s)=>a+Number(s.profit),0),ex=expenses.reduce((a,x)=>a+Number(x.amount),0),potential=products.reduce((a,p)=>a+Number(p.price)*Number(stockFor(p.id).stock),0)-inventory.reduce((a,i)=>a+Number(i.cost)*Number(i.stock),0);return `<div class="cards"><div class="stat"><label>Ventas del mes</label><strong>${money(ms.reduce((a,s)=>a+Number(s.total),0))}</strong></div><div class="stat"><label>Ganancia bruta del mes</label><strong class="green">${money(ms.reduce((a,s)=>a+Number(s.profit),0))}</strong></div><div class="stat"><label>Ganancia histórica</label><strong class="green">${money(profit)}</strong></div><div class="stat"><label>Ganancia potencial</label><strong>${money(potential)}</strong></div></div><section class="box"><h3>Gastos del negocio</h3><form id="expenseForm" class="formgrid"><label>Concepto<input class="field" id="expenseTitle" required maxlength="120"></label><label>Monto<input class="field" id="expenseAmount" type="number" min="0" step="0.01" required></label><div><button>Registrar gasto</button></div><div id="expenseMsg" class="msg"></div></form><p>Gastos acumulados: <b>${money(ex)}</b></p><p>Ganancia después de gastos registrados: <b class="green">${money(profit-ex)}</b></p><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>${expenses.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sin gastos.</td></tr>'}</tbody></table></div><p class="note">Cálculo orientativo: la ganancia bruta resta el costo registrado de la mercancía; no incluye impuestos ni comisiones no capturadas.</p></section>`}
async function saveExpense(e){e.preventDefault();let {error}=await sb.from('expenses').insert({title:$('#expenseTitle').value.trim(),amount:Number($('#expenseAmount').value),date:today()});if(error){$('#expenseMsg').textContent=say(error);return}await loadAdmin();renderAdmin()}
function adminOrders(){return `<section class="box"><h3>Pedidos recibidos</h3><p class="muted">Los pedidos se mantienen pendientes hasta que confirmes existencias y entrega.</p><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente / teléfono</th><th>Pedido</th><th>Total estimado</th><th>Estado</th><th>Actualizar</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('es-MX')}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br><small class="muted">${esc(o.address||'')}</small></td><td>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td><td><select class="field" onchange="setOrderStatus('${o.id}',this.value)">${['Pendiente','Confirmado','Entregado','Cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay pedidos todavía.</td></tr>'}</tbody></table></div></section>`}
async function setOrderStatus(id,status){try{const {error}=await sb.rpc('set_order_status',{p_order_id:id,p_status:status});if(error)throw error;await loadAdmin();renderAdmin()}catch(err){alert('No se pudo actualizar el pedido: '+say(err));await loadAdmin().catch(()=>{});renderAdmin()}}
function bindAdmin(){let f=$('#productForm');if(f){f.onsubmit=saveProduct;let imageInput=$('#pImageFile');if(imageInput)imageInput.onchange=previewProductImage;}let b=$('#purchaseForm');if(b)b.onsubmit=savePurchase;let x=$('#expenseForm');if(x)x.onsubmit=saveExpense;let s=$('#saleSearch');if(s)s.oninput=()=>{let q=s.value.toLowerCase();$('#saleProducts').innerHTML=products.filter(p=>p.active&&[p.name,p.code,p.category].join(' ').toLowerCase().includes(q)).map(p=>`<div class="product"><div class="pbody"><b>${esc(p.name)}</b><small>Existencia: ${stockFor(p.id).stock||0}</small><div class="price">${money(p.price)}</div><button onclick="addSaleCart('${p.id}')" ${Number(stockFor(p.id).stock)<1?'disabled':''}>Agregar</button></div></div>`).join('')||'<div class="empty">Sin coincidencias.</div>'}}
async function startAdmin(){let {data}=await sb.auth.getSession();user=data.session?.user||null;if(user?.id===ADMIN_UID){await adminStart()}else{if(user)await sb.auth.signOut();user=null;loginView()}}
$('#storeBtn').addEventListener('click',()=>renderStore());$('#adminBtn').addEventListener('click',()=>{if(mode==='admin')renderStore();else if(user?.id===ADMIN_UID)adminStart();else loginView()});
(async()=>{try{await loadStore();renderStore();}catch(e){$('#app').innerHTML=`<section class="box"><h2>No se pudo cargar la tienda</h2><p class="msg">${esc(say(e))}</p><p class="muted">Verifica que hayas ejecutado el SQL de configuración y que la conexión esté disponible.</p></section>`}})();
sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user?.id===ADMIN_UID&&mode!=='admin')adminStart();else if(!user&&mode==='admin')renderStore()});
</script></body></html>
